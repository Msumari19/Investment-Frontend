<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Msumari Investments — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A;
    --ink-soft: #5A6B85;
    --paper: #F5F6F2;
    --paper-panel: #FFFFFF;
    --grid-line: #C9D2DE;
    --copper: #B87333;
    --copper-deep: #96592A;
    --income: #2F6F62;
    --expense: #A6432C;
    --income-bg: #E8F1EE;
    --expense-bg: #F7EAE6;
    --radius: 4px;
    --sidebar-w: 220px;

    --font-display: "Space Grotesk", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    font-family: var(--font-body);
    color: var(--ink);
    display: flex;
  }

  .sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: var(--ink);
    background-image: linear-gradient(180deg, #1B2A4A 0%, #14203A 100%);
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
  }

  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 26px; border-bottom: 1px solid rgba(245,246,242,0.12); margin-bottom: 20px; }
  .brand-mark { width: 34px; height: 34px; flex-shrink: 0; }
  .brand-text { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #F5F6F2; line-height: 1.2; }
  .brand-text span { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper); margin-top: 2px; }

  .nav-links { display: flex; flex-direction: column; gap: 2px; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); color: rgba(245,246,242,0.65); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: background 0.15s ease, color 0.15s ease; }
  .nav-link:hover { background: rgba(245,246,242,0.06); color: #F5F6F2; }
  .nav-link.active { background: rgba(184,115,51,0.18); color: #F5F6F2; box-shadow: inset 3px 0 0 var(--copper); }
  .nav-tick { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.5; }

  .sidebar-spacer { flex: 1; }
  .user-block { border-top: 1px solid rgba(245,246,242,0.12); padding-top: 14px; margin-top: 8px; }
  .user-name { font-family: var(--font-mono); font-size: 11.5px; color: rgba(245,246,242,0.55); padding: 0 12px 10px; }
  .logout-btn { width: 100%; background: none; border: 1px solid rgba(245,246,242,0.2); color: #F5F6F2; padding: 9px 12px; border-radius: var(--radius); font-size: 12.5px; cursor: pointer; font-family: var(--font-body); font-weight: 500; }
  .logout-btn:hover { background: rgba(245,246,242,0.08); }

  .main { flex: 1; padding: 36px 44px 60px; max-width: 1100px; }

  .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 6px; }
  .page-title { font-family: var(--font-display); font-weight: 700; font-size: 26px; margin: 0 0 4px; }
  .page-sub { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }

  .add-btn {
    background: var(--copper); color: #fff; border: none; padding: 11px 20px; border-radius: var(--radius);
    font-family: var(--font-body); font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .add-btn:hover { background: var(--copper-deep); }
  .add-btn svg { width: 14px; height: 14px; }

  .tick-divider {
    height: 8px; margin: 16px 0 32px;
    background-image: repeating-linear-gradient(to right, var(--grid-line) 0, var(--grid-line) 1px, transparent 1px, transparent 12px);
    background-position: bottom; background-size: 100% 8px; background-repeat: repeat-x; border-bottom: 1px solid var(--grid-line);
  }

  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .summary-card { background: var(--paper-panel); border: 1px solid var(--grid-line); border-radius: var(--radius); padding: 20px 22px; position: relative; }
  .summary-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--grid-line); border-radius: var(--radius) var(--radius) 0 0; }
  .summary-card.income::before { background: var(--income); }
  .summary-card.expense::before { background: var(--expense); }
  .summary-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin: 6px 0 10px; font-weight: 500; }
  .summary-value { font-family: var(--font-mono); font-size: 30px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .summary-value.income { color: var(--income); }
  .summary-value.expense { color: var(--expense); }

  .panel { background: var(--paper-panel); border: 1px solid var(--grid-line); border-radius: var(--radius); padding: 26px 28px; margin-bottom: 22px; }
  .panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0 0 20px; }

  /* ---------- Native charts, no external library ---------- */

  .charts-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 36px; }

  .bar-chart-item { margin-bottom: 18px; }
  .bar-chart-item:last-child { margin-bottom: 0; }
  .bar-chart-label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .bar-chart-label .name { font-weight: 600; color: var(--ink-soft); }
  .bar-chart-label .val { font-family: var(--font-mono); font-weight: 600; }
  .bar-track { height: 14px; background: var(--paper); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .bar-fill.income { background: var(--income); }
  .bar-fill.expense { background: var(--expense); }

  .donut-wrap { display: flex; align-items: center; gap: 22px; }
  .donut {
    width: 130px; height: 130px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .donut-hole {
    width: 72px; height: 72px; border-radius: 50%; background: var(--paper-panel);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); text-align: center; padding: 4px;
  }
  .legend { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .legend-name { color: var(--ink-soft); flex: 1; }
  .legend-val { font-family: var(--font-mono); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); padding: 0 8px 10px; border-bottom: 1px solid var(--grid-line); }
  td { padding: 12px 8px; border-bottom: 1px solid var(--grid-line); }
  td.amount { text-align: right; font-family: var(--font-mono); font-weight: 600; }
  td.amount.income { color: var(--income); }
  td.amount.expense { color: var(--expense); }
  .empty-state { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 30px 0; }
  .del-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 12px; font-family: var(--font-mono); text-decoration: underline; }
  .del-btn:hover { color: var(--copper-deep); }

  /* ---------- Modal ---------- */

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(27,42,74,0.55);
    align-items: flex-start; justify-content: center; padding: 60px 20px; z-index: 50; overflow-y: auto;
  }
  .modal-overlay.show { display: flex; }

  .modal-box { background: var(--paper-panel); border-radius: var(--radius); padding: 28px 30px; width: 100%; max-width: 440px; }

  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 0; }
  .modal-close { background: none; border: none; font-size: 20px; line-height: 1; color: var(--ink-soft); cursor: pointer; padding: 4px; }
  .modal-close:hover { color: var(--ink); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .field label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 10px 11px; font-family: var(--font-body); font-size: 14px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--grid-line); border-radius: var(--radius);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--copper); box-shadow: 0 0 0 3px rgba(184,115,51,0.14); }

  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn { flex: 1; padding: 10px; border: 1px solid var(--grid-line); background: var(--paper); border-radius: var(--radius); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
  .type-btn.active[data-type="income"] { background: var(--income); border-color: var(--income); color: #fff; }
  .type-btn.active[data-type="expense"] { background: var(--expense); border-color: var(--expense); color: #fff; }

  .submit-btn { width: 100%; padding: 12px; background: var(--copper); color: #fff; border: none; border-radius: var(--radius); font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; }
  .submit-btn:hover { background: var(--copper-deep); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .quick-cat { display: flex; gap: 8px; margin-top: 14px; }
  .quick-cat input { flex: 1; padding: 9px 10px; font-family: var(--font-body); font-size: 13px; border: 1px solid var(--grid-line); border-radius: var(--radius); background: var(--paper); }
  .quick-cat button { padding: 9px 14px; background: #fff; border: 1px solid var(--grid-line); border-radius: var(--radius); font-family: var(--font-body); font-size: 13px; cursor: pointer; color: var(--copper-deep); font-weight: 600; }
  .quick-cat button:hover { background: var(--paper); }

  .status { margin-top: 14px; padding: 11px 13px; border-radius: var(--radius); font-size: 13px; display: none; }
  .status.show { display: block; }
  .status.error { background: var(--expense-bg); color: var(--expense); border: 1px solid #E3C4B8; }
  .status.ok { background: var(--income-bg); color: var(--income); border: 1px solid #C3DCD5; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; min-height: auto; position: static; flex-direction: row; align-items: center; padding: 12px 16px; }
    .brand { border: none; padding: 0; margin: 0; margin-right: auto; }
    .nav-links { flex-direction: row; }
    .sidebar-spacer { display: none; }
    .user-block { border: none; padding: 0; margin: 0; display: flex; align-items: center; gap: 10px; }
    .user-name { display: none; }
    .main { padding: 24px 18px 50px; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .summary-grid { grid-template-columns: 1fr; }
    .charts-row { grid-template-columns: 1fr; gap: 26px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="4" width="12" height="4" rx="1" fill="#B87333"/>
      <rect x="18.4" y="8" width="3.2" height="19" fill="#B87333"/>
      <path d="M18.4 27 L20 35 L21.6 27 Z" fill="#B87333"/>
      <line x1="26" y1="11" x2="29" y2="11" stroke="#8FA0BE" stroke-width="1"/>
      <line x1="26" y1="15" x2="28" y2="15" stroke="#8FA0BE" stroke-width="1"/>
      <line x1="26" y1="19" x2="29" y2="19" stroke="#8FA0BE" stroke-width="1"/>
      <line x1="26" y1="23" x2="28" y2="23" stroke="#8FA0BE" stroke-width="1"/>
    </svg>
    <div class="brand-text">Msumari<span>Nailed down</span></div>
  </div>

  <nav class="nav-links">
    <a href="dashboard.html" class="nav-link active"><span class="nav-tick"></span> Dashboard</a>
    <a href="plan.html" class="nav-link"><span class="nav-tick"></span> Plan</a>
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="user-block">
    <p class="user-name" id="user-name-display">…</p>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Dashboard</h1>
      <p class="page-sub">Your ledger, measured monthly</p>
    </div>
    <button class="add-btn" onclick="openModal()">
      <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      Add transaction
    </button>
  </div>
  <div class="tick-divider"></div>

  <div class="summary-grid">
    <div class="summary-card income">
      <p class="summary-label">Income</p>
      <p class="summary-value income" id="summary-income">TZS 0</p>
    </div>
    <div class="summary-card expense">
      <p class="summary-label">Expenses</p>
      <p class="summary-value expense" id="summary-expenses">TZS 0</p>
    </div>
    <div class="summary-card">
      <p class="summary-label">Net</p>
      <p class="summary-value" id="summary-net">TZS 0</p>
    </div>
  </div>

  <div class="panel">
    <h2>Overview</h2>
    <div class="charts-row">
      <div>
        <p class="summary-label" style="margin-bottom:14px;">Income vs Expenses</p>
        <div id="bar-chart"></div>
      </div>
      <div>
        <p class="summary-label" style="margin-bottom:14px;">Expenses by Category</p>
        <div id="donut-chart"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Recent transactions</h2>
    <div id="tx-list-wrap">
      <p class="empty-state">Loading…</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Add a transaction</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>

    <form id="tx-form">
      <div class="type-toggle">
        <button type="button" class="type-btn active" data-type="expense" onclick="setTxType('expense')">Expense</button>
        <button type="button" class="type-btn" data-type="income" onclick="setTxType('income')">Income</button>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="tx-date">Date</label>
          <input type="date" id="tx-date" required>
        </div>
        <div class="field">
          <label for="tx-amount">Amount (TZS)</label>
          <input type="number" id="tx-amount" min="1" step="1" required placeholder="50000">
        </div>
      </div>

      <div class="field" style="margin-bottom:14px;">
        <label for="tx-category">Category</label>
        <select id="tx-category">
          <option value="">Uncategorized</option>
        </select>
      </div>

      <div class="field" style="margin-bottom:14px;">
        <label for="tx-note">Note (optional)</label>
        <input type="text" id="tx-note" placeholder="e.g. Weekly groceries">
      </div>

      <button type="submit" class="submit-btn" id="tx-submit-btn">Add expense</button>
    </form>

    <div class="quick-cat">
      <input type="text" id="new-cat-name" placeholder="New category name">
      <button type="button" onclick="addCategory()">Add category</button>
    </div>

    <div class="status" id="tx-status"></div>
  </div>
</div>

<script>
  const API_BASE = 'https://investment-backend-g967.onrender.com';
  const token = sessionStorage.getItem('msumari_token');

  if (!token) {
    window.location.href = 'index.html';
  }

  let currentTxType = 'expense';
  let categories = [];

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  }

  function logout() {
    sessionStorage.removeItem('msumari_token');
    window.location.href = 'index.html';
  }

  function formatTZS(amount) {
    return 'TZS ' + Number(amount).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function openModal() {
    document.getElementById('modal-overlay').classList.add('show');
    document.getElementById('tx-date').valueAsDate = new Date();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('show');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  function setTxType(type) {
    currentTxType = type;
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.type === type);
    });
    document.getElementById('tx-submit-btn').textContent = type === 'income' ? 'Add income' : 'Add expense';
    loadCategories();
  }

  async function handleAuthFailure(res) {
    if (res.status === 401 || res.status === 422) {
      sessionStorage.removeItem('msumari_token');
      window.location.href = 'index.html';
      return true;
    }
    return false;
  }

  async function loadUser() {
    try {
      const res = await fetch(API_BASE + '/api/auth/me', { headers: authHeaders() });
      if (await handleAuthFailure(res)) return;
      const data = await res.json();
      document.getElementById('user-name-display').textContent = data.name || data.email;
    } catch (err) {
      document.getElementById('user-name-display').textContent = '';
    }
  }

  const PALETTE = ['#B87333', '#2F6F62', '#A6432C', '#1B2A4A', '#8FA0BE', '#C9A227', '#6B8F87', '#96592A'];

  function renderCharts(summary) {
    const income = summary.total_income || 0;
    const expenses = summary.total_expenses || 0;
    const byCategory = summary.expenses_by_category || {};

    // --- Bar comparison (pure CSS, no library) ---
    const max = Math.max(income, expenses, 1);
    const incomePct = (income / max) * 100;
    const expensePct = (expenses / max) * 100;

    document.getElementById('bar-chart').innerHTML = `
      <div class="bar-chart-item">
        <div class="bar-chart-label"><span class="name">Income</span><span class="val">${formatTZS(income)}</span></div>
        <div class="bar-track"><div class="bar-fill income" style="width:${incomePct}%"></div></div>
      </div>
      <div class="bar-chart-item">
        <div class="bar-chart-label"><span class="name">Expenses</span><span class="val">${formatTZS(expenses)}</span></div>
        <div class="bar-track"><div class="bar-fill expense" style="width:${expensePct}%"></div></div>
      </div>
    `;

    // --- Donut (pure CSS conic-gradient, no library) ---
    const donutEl = document.getElementById('donut-chart');
    const catEntries = Object.entries(byCategory);
    const total = catEntries.reduce((sum, [, v]) => sum + v, 0);

    if (catEntries.length === 0 || total === 0) {
      donutEl.innerHTML = '<p class="empty-state" style="padding:20px 0;">No categorized expenses yet.</p>';
      return;
    }

    let cumulative = 0;
    const stops = catEntries.map(([name, val], i) => {
      const start = (cumulative / total) * 360;
      cumulative += val;
      const end = (cumulative / total) * 360;
      return `${PALETTE[i % PALETTE.length]} ${start}deg ${end}deg`;
    }).join(', ');

    const legendRows = catEntries.map(([name, val], i) => `
      <div class="legend-row">
        <span class="legend-dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
        <span class="legend-name">${name}</span>
        <span class="legend-val">${formatTZS(val)}</span>
      </div>
    `).join('');

    donutEl.innerHTML = `
      <div class="donut-wrap">
        <div class="donut" style="background: conic-gradient(${stops});">
          <div class="donut-hole">${formatTZS(total)}</div>
        </div>
        <div class="legend">${legendRows}</div>
      </div>
    `;
  }

  async function loadSummary() {
    try {
      const res = await fetch(API_BASE + '/api/transactions/summary', { headers: authHeaders() });
      if (await handleAuthFailure(res)) return;
      const data = await res.json();
      document.getElementById('summary-income').textContent = formatTZS(data.total_income);
      document.getElementById('summary-expenses').textContent = formatTZS(data.total_expenses);
      document.getElementById('summary-net').textContent = formatTZS(data.net);
      renderCharts(data);
    } catch (err) {
      console.error('Failed to load summary', err);
    }
  }

  async function loadCategories() {
    try {
      const res = await fetch(API_BASE + '/api/categories?type=' + currentTxType, { headers: authHeaders() });
      if (await handleAuthFailure(res)) return;
      categories = await res.json();
      const select = document.getElementById('tx-category');
      select.innerHTML = '<option value="">Uncategorized</option>' +
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    } catch (err) {
      console.error('Failed to load categories', err);
    }
  }

  async function addCategory() {
    const input = document.getElementById('new-cat-name');
    const name = input.value.trim();
    if (!name) return;

    try {
      const res = await fetch(API_BASE + '/api/categories', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ name, type: currentTxType })
      });
      if (await handleAuthFailure(res)) return;
      const data = await res.json();
      if (!res.ok) {
        showTxStatus(data.error || 'Could not add category', 'error');
        return;
      }
      input.value = '';
      showTxStatus(`Category "${data.name}" added.`, 'ok');
      loadCategories();
    } catch (err) {
      showTxStatus('Could not reach the server.', 'error');
    }
  }

  function showTxStatus(message, type) {
    const el = document.getElementById('tx-status');
    el.textContent = message;
    el.className = 'status show ' + type;
    setTimeout(() => { el.className = 'status'; }, 4000);
  }

  async function loadTransactions() {
    const wrap = document.getElementById('tx-list-wrap');
    try {
      const res = await fetch(API_BASE + '/api/transactions', { headers: authHeaders() });
      if (await handleAuthFailure(res)) return;
      const txs = await res.json();

      window._txCache = txs;

      if (txs.length === 0) {
        wrap.innerHTML = '<p class="empty-state">No transactions yet. Click "Add transaction" above.</p>';
        return;
      }

      const rows = txs.slice(0, 25).map(t => renderRow(t)).join('');

      wrap.innerHTML = `
        <table>
          <thead>
            <tr><th>Date</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th></th></tr>
          </thead>
          <tbody id="tx-tbody">${rows}</tbody>
        </table>
      `;
    } catch (err) {
      wrap.innerHTML = '<p class="empty-state">Could not load transactions.</p>';
    }
  }

  function renderRow(t) {
    return `
      <tr id="row-${t.id}">
        <td>${t.date}</td>
        <td>${t.category || 'Uncategorized'}</td>
        <td>${t.note || ''}</td>
        <td class="amount ${t.type}">${t.type === 'expense' ? '−' : '+'}${formatTZS(t.amount)}</td>
        <td>
          <button class="del-btn" onclick="editTransaction(${t.id})">Edit</button>
          &nbsp;·&nbsp;
          <button class="del-btn" onclick="deleteTransaction(${t.id})">Remove</button>
        </td>
      </tr>
    `;
  }

  function editTransaction(id) {
    const t = (window._txCache || []).find(tx => tx.id === id);
    if (!t) return;

    const row = document.getElementById('row-' + id);
    row.innerHTML = `
      <td><input type="date" id="edit-date-${id}" value="${t.date}" style="width:100%;padding:6px;font-size:13px;border:1px solid var(--grid-line);border-radius:var(--radius);"></td>
      <td colspan="1"><input type="text" id="edit-note-${id}" value="${(t.note || '').replace(/"/g, '&quot;')}" placeholder="Note" style="width:100%;padding:6px;font-size:13px;border:1px solid var(--grid-line);border-radius:var(--radius);"></td>
      <td></td>
      <td class="amount"><input type="number" id="edit-amount-${id}" value="${t.amount}" min="1" step="1" style="width:100%;padding:6px;font-size:13px;text-align:right;border:1px solid var(--grid-line);border-radius:var(--radius);"></td>
      <td>
        <button class="del-btn" onclick="saveTransaction(${id})">Save</button>
        &nbsp;·&nbsp;
        <button class="del-btn" onclick="loadTransactions()">Cancel</button>
      </td>
    `;
  }

  async function saveTransaction(id) {
    const amount = document.getElementById('edit-amount-' + id).value;
    const date = document.getElementById('edit-date-' + id).value;
    const note = document.getElementById('edit-note-' + id).value.trim();

    try {
      const res = await fetch(API_BASE + '/api/transactions/' + id, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify({ amount, date, note: note || null })
      });
      if (await handleAuthFailure(res)) return;
      const data = await res.json();

      if (!res.ok) {
        showTxStatus(data.error || 'Could not update transaction.', 'error');
        return;
      }

      showTxStatus('Transaction updated.', 'ok');
      loadTransactions();
      loadSummary();
    } catch (err) {
      showTxStatus('Could not reach the server.', 'error');
    }
  }

  async function deleteTransaction(id) {
    try {
      const res = await fetch(API_BASE + '/api/transactions/' + id, {
        method: 'DELETE',
        headers: authHeaders()
      });
      if (await handleAuthFailure(res)) return;
      loadTransactions();
      loadSummary();
    } catch (err) {
      showTxStatus('Could not remove transaction.', 'error');
    }
  }

  document.getElementById('tx-form').addEventListener('submit', async (evt) => {
    evt.preventDefault();
    const btn = document.getElementById('tx-submit-btn');
    btn.disabled = true;

    const payload = {
      type: currentTxType,
      date: document.getElementById('tx-date').value,
      amount: document.getElementById('tx-amount').value,
      note: document.getElementById('tx-note').value.trim() || null,
      category_id: document.getElementById('tx-category').value || null
    };

    try {
      const res = await fetch(API_BASE + '/api/transactions', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(payload)
      });
      if (await handleAuthFailure(res)) return;
      const data = await res.json();

      if (!res.ok) {
        showTxStatus(data.error || 'Could not add transaction.', 'error');
        return;
      }

      showTxStatus('Transaction added.', 'ok');
      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-note').value = '';
      loadTransactions();
      loadSummary();
      setTimeout(closeModal, 900);
    } catch (err) {
      showTxStatus('Could not reach the server. It may be starting up — try again shortly.', 'error');
    } finally {
      btn.disabled = false;
    }
  });

  loadUser();
  loadCategories();
  loadTransactions();
  loadSummary();
</script>

</body>
</html>
